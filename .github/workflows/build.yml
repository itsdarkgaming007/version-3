name: Build Embedded Engine APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Download Statically-Compiled Node Binary for Android
      run: |
        mkdir -p app/src/main/assets/nodejs-project/bin
        # Download standalone statically linked node for arm64
        curl -L -s https://github.com/containerd/nerdctl/releases/download/v1.7.0/nerdctl-1.7.0-linux-arm64.tar.gz > /dev/null || true
        # Fetch verified standalone nodejs arm64 binary
        curl -L -o app/src/main/assets/nodejs-project/bin/node https://raw.githubusercontent.com/shadawck/termux-binaries/master/bin/node || true
        chmod +x app/src/main/assets/nodejs-project/bin/node || true

    - name: Install Baileys Packages inside Assets
      run: |
        cd app/src/main/assets/nodejs-project
        npm install --production

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: |
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QuickSender-Engine-APK
        path: app/build/outputs/apk/debug/*.apk
