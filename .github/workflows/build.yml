name: Build Embedded Engine APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Download Precompiled Android Node Executable
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        
        # Download precompiled standalone Android node binary (arm64)
        curl -L -o app/src/main/jniLibs/arm64-v8a/libnode.so https://github.com/nodemcu/nodemcu-firmware/releases/download/v1.0.0/node-v16.14.0-android-arm64 || true
        # Download fallback or build node binary
        curl -L -s https://raw.githubusercontent.com/shadawck/termux-binaries/master/bin/node -o app/src/main/jniLibs/arm64-v8a/libnode.so

    - name: Install Node Modules inside Assets
      run: |
        cd app/src/main/assets/nodejs-project
        npm install --production

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: |
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QuickSender-Engine-APK
        path: app/build/outputs/apk/debug/*.apk
